repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        files: ^dbt/(models|macros|tests)/.*\.sql$
        additional_dependencies:
          - dbt-core==1.8.8
          - dbt-clickhouse==1.8.8
          - sqlfluff-templater-dbt==3.4.2
      - id: sqlfluff-fix
        files: ^dbt/(models|macros|tests)/.*\.sql$
        additional_dependencies:
          - dbt-core==1.8.8
          - dbt-clickhouse==1.8.8
          - sqlfluff-templater-dbt==3.4.2