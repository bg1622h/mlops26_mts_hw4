version: 2

models:
  - name: stg_transactions
    description: "Очистка транзакций, вычисление ключей, временных признаков и сегмента суммы"
    columns:
      - name: transaction_id
        tests: [not_null, unique]

      - name: transaction_time
        description: "Время и дата транзакции"
        tests: [not_null]

      - name: transaction_date
        description: "Дата транзакции"
        tests: [not_null]

      - name: transaction_hour
        description: "Час транзакции"
        tests: [not_null]

      - name: day_of_week
        description: "День недели транзакции"
        tests: [not_null]

      - name: merch
        description: "Имя продавца"
        tests: [not_null]

      - name: cat_id
        description: "Категория транзакции"
        tests: [not_null]

      - name: amount
        description: "Сумма транзакции"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: customer_id
        tests: [not_null]

      - name: name_1
        description: "Имя клиента"
        tests: [not_null]

      - name: name_2
        description: "Фамилия клиента"
        tests: [not_null]

      - name: gender
        description: "Пол клиента"
        tests:
          - not_null
          - accepted_values:
              values: ["M", "F"]

      - name: us_state
        description: "Код штата"
        tests: [not_null]

      - name: lat
        description: "Широта клиента"
        tests: [not_null]

      - name: lon
        description: "Долгота клиента"
        tests: [not_null]

      - name: merchant_lat
        description: "Широта продавца"
        tests: [not_null]

      - name: merchant_lon
        description: "Долгота продавца"
        tests: [not_null]

      - name: target
        description: "Мошенническая ли транзакция?"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: amount_bucket
        description: "Сегмент суммы транзакции (small, medium ,large)"
        tests:
          - not_null
          - accepted_values:
              values: ["small", "medium", "large"]

unit_tests:
  - name: test_stg_transactions_amount_bucket
    model: stg_transactions
    given:
      - input: source('transactions_db', 'transactions')
        rows:
          - transaction_time: "2024-01-01 10:15:00"
            merch: shop
            cat_id: food
            amount: 0
            name_1: Customer0
            name_2: Smith
            gender: F
            us_state: NY
            lat: 40.7
            lon: -73.9
            merchant_lat: 40.8
            merchant_lon: -73.8
            target: 0

          - transaction_time: "2024-01-01 10:15:00"
            merch: shop
            cat_id: food
            amount: 99.99
            name_1: Customer1
            name_2: Smith
            gender: F
            us_state: NY
            lat: 40.7
            lon: -73.9
            merchant_lat: 40.8
            merchant_lon: -73.8
            target: 0

          - transaction_time: "2024-01-01 10:15:00"
            merch: shop
            cat_id: food
            amount: 100
            name_1: Customer2
            name_2: Smith
            gender: F
            us_state: NY
            lat: 40.7
            lon: -73.9
            merchant_lat: 40.8
            merchant_lon: -73.8
            target: 0

          - transaction_time: "2024-01-01 10:15:00"
            merch: shop
            cat_id: food
            amount: 999.99
            name_1: Customer3
            name_2: Smith
            gender: F
            us_state: NY
            lat: 40.7
            lon: -73.9
            merchant_lat: 40.8
            merchant_lon: -73.8
            target: 0

          - transaction_time: "2024-01-01 10:15:00"
            merch: shop
            cat_id: food
            amount: 1000
            name_1: Customer4
            name_2: Smith
            gender: F
            us_state: NY
            lat: 40.7
            lon: -73.9
            merchant_lat: 40.8
            merchant_lon: -73.8
            target: 0

    expect:
      rows:
        - name_1: Customer0
          amount_bucket: small
          target: 0
          day_of_week: 1

        - name_1: Customer1
          amount_bucket: small
          target: 0
          day_of_week: 1

        - name_1: Customer2
          amount_bucket: medium
          target: 0
          day_of_week: 1

        - name_1: Customer3
          amount_bucket: medium
          target: 0
          day_of_week: 1

        - name_1: Customer4
          amount_bucket: large
          target: 0
          day_of_week: 1

  - name: test_stg_transactions_normalization
    model: stg_transactions
    given:
      - input: source('transactions_db', 'transactions')
        rows:
          - transaction_time: "2024-01-07 23:15:00"
            merch: " shop "
            cat_id: " food "
            amount: 50.0
            name_1: " Ann "
            name_2: " Smith "
            gender: " f "
            us_state: " ny "
            lat: 40.7
            lon: -73.9
            merchant_lat: 40.8
            merchant_lon: -73.8
            target: 1

    expect:
      rows:
        - merch: shop
          cat_id: food
          name_1: Ann
          name_2: Smith
          gender: F
          us_state: NY
          day_of_week: 7
          transaction_hour: 23
          target: 1